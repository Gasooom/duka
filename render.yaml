# Render Blueprint for the Duka backend: one FastAPI web service + one PostgreSQL (pgvector) database, Frankfurt.
# Secrets are never written here: they are generated by Render (generateValue) or entered in the dashboard
# (sync: false). See docs/DEPLOYMENT.md > "Render".
services:
  - type: web
    name: duka-api
    runtime: docker
    region: frankfurt
    # Not "free": free services spin down when idle (the in-process WhatsApp/outbox workers would stop) and have
    # no pre-deploy command (needed to run migrations once, before the new version starts).
    plan: starter
    numInstances: 1          # the rate limiter is in-process; one instance for the pilot
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    preDeployCommand: alembic upgrade head
    healthCheckPath: /healthz
    autoDeploy: false        # deploy deliberately, after the eval suite passed
    envVars:
      - key: DATABASE_URL    # internal (private network) connection string
        fromDatabase:
          name: duka-db
          property: connectionString
      - key: APP_ENV
        value: production
      - key: RUN_MIGRATIONS_ON_START
        value: "false"       # the pre-deploy command migrates
      - key: FORWARDED_ALLOW_IPS
        value: "*"           # only Render's proxy reaches the service; needed for real client IPs
      - key: PUBLIC_BASE_URL # https://<service>.onrender.com (or your domain)
        sync: false
      - key: CORS_ORIGINS    # the dashboard's origin once it is deployed; the API's own URL until then
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE_MINUTES
        value: "720"
      - key: ENCRYPTION_KEY  # a Fernet key (see docs); Render's generated values are not Fernet keys
        sync: false
      - key: LLM_PROVIDER
        value: openai_compat
      - key: LLM_BASE_URL
        value: https://api.openai.com/v1
      - key: LLM_MODEL
        value: gpt-4o-mini
      - key: LLM_API_KEY
        sync: false
      - key: AGENT_TURN_TIMEOUT_SECONDS
        value: "45"
      - key: EMBEDDING_PROVIDER
        value: hash
      - key: WHATSAPP_VERIFY_TOKEN
        generateValue: true
      - key: WHATSAPP_APP_SECRET  # Meta app secret (required at startup; see docs before Meta is connected)
        sync: false
      - key: WHATSAPP_API_VERSION
        value: v21.0
      - key: WHATSAPP_FORCE_DEV
        value: "false"
      - key: PAYMENT_WEBHOOK_SECRET
        generateValue: true
      - key: OPS_TOKEN       # bearer token for /metrics and /readyz?details=1
        generateValue: true
      - key: BACKGROUND_WORKERS
        value: "2"
      - key: WEBHOOK_EVENT_RETENTION_DAYS
        value: "30"
      - key: LOG_LEVEL
        value: INFO
      - key: ENABLE_DEV_TOOLS
        value: "false"
      - key: ALLOW_PUBLIC_REGISTRATION
        value: "false"

databases:
  - name: duka-db
    region: frankfurt
    plan: basic-256mb
    postgresMajorVersion: "16"
    databaseName: duka
    user: duka
    ipAllowList: []          # no connections from outside Render's private network
