# PRODUCTION / STAGING stack for one small server. Deploy with deploy/deploy.sh (see docs/DEPLOYMENT.md).
#
#   internet ──443/80──► caddy (automatic HTTPS) ──┬─► backend:8000   /api/*, /webhooks/*, /healthz, /readyz, /metrics
#                                                  └─► frontend:3000  everything else (dashboard)
#   backend ──► db:5432 (PostgreSQL + pgvector, persistent volume)
#
# Only caddy publishes ports. PostgreSQL, the API and the dashboard are reachable solely on the internal network.
name: ${COMPOSE_PROJECT_NAME:-duka-prod}

x-logging: &logging
  driver: json-file
  options: {max-size: "20m", max-file: "5"}

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in the env file}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the env file}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in the env file}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 30
    logging: *logging
    networks: [internal]

  backend:
    build:
      context: ../backend
      args: {INSTALL_DEV: "false"}
    restart: unless-stopped
    env_file: ["${DUKA_ENV_FILE:-.env.production}"]
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      PUBLIC_BASE_URL: https://${DUKA_DOMAIN:?set DUKA_DOMAIN in the env file}
      CORS_ORIGINS: https://${DUKA_DOMAIN}
      FORWARDED_ALLOW_IPS: "*"   # only caddy can reach the backend
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/healthz')\""]
      interval: 10s
      timeout: 3s
      retries: 30
    logging: *logging
    networks: [internal]

  frontend:
    build: ../frontend
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      backend: {condition: service_healthy}
    logging: *logging
    networks: [internal]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      DUKA_DOMAIN: ${DUKA_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [backend, frontend]
    logging: *logging
    networks: [internal]

networks:
  internal: {}

volumes:
  pgdata:
  caddy_data:
  caddy_config:
